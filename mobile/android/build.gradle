// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Windows only: with the project in a long folder, release native builds
// (RelWithDebInfo) push CMake object paths past the 260-character MAX_PATH.
// Keep every module's CMake build tree under a short folder instead. Must run
// before the root plugins below, which force :app to be evaluated.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
  subprojects { project ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
      project.plugins.withId(pluginId) {
        project.android.externalNativeBuild.cmake.buildStagingDirectory =
          new File(System.getProperty('user.home'), ".cxx/${project.name}")
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
